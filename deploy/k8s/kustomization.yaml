apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mcp
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: mcpkit
    literals:
      - MCPKIT_ISSUER=https://idp.example.com
      - MCPKIT_AUDIENCE=https://mcp.example.com/mcp
      - MCPKIT_JWKS_URL=https://idp.example.com/.well-known/jwks.json
      - MCPKIT_JWKS_FILE=
      - MCPKIT_REDIS_URL=redis://redis.mcp.svc:6379/0
      - MCPKIT_ALLOWED_HOSTS=["mcp.example.com", "mcpkit.mcp.svc:8000"]
