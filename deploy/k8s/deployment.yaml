apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcpkit
  labels: {app: mcpkit}
spec:
  replicas: 3
  selector:
    matchLabels: {app: mcpkit}
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: mcpkit}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: mcpkit}
      containers:
        - name: mcpkit
          image: ghcr.io/darshansatpathy/mcp-server-toolkit:0.1.0
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: mcpkit}}]
          resources:
            requests: {cpu: 250m, memory: 192Mi}
            limits: {memory: 384Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        # The example store is SQLite per pod. Replace it with your database before running more than one replica for real data.
        - {name: data, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
